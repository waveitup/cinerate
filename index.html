<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineRate — Streamlined Ratings & Guides</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4 { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        .ott-scroll::-webkit-scrollbar {
            height: 6px;
        }
        .ott-scroll::-webkit-scrollbar-track {
            background: #090d16;
        }
        .ott-scroll::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 10px;
        }
        .ott-scroll::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>
</head>
<body class="bg-[#030712] text-slate-100 min-h-screen selection:bg-sky-500/30 selection:text-sky-200 overflow-y-scroll">

    <!-- Header Section -->
    <header class="border-b border-slate-900 bg-[#030712]/90 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-24 flex flex-col md:flex-row justify-between items-center gap-4 py-4 md:py-0">
            
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3 group cursor-pointer self-start md:self-center" onclick="showHomepage()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20 group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-play text-white text-sm ml-0.5"></i>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-white">CINE<span class="bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">RATE</span></span>
            </div>
            
            <!-- Fixed & Broadened Search Bar Layout -->
            <div class="w-full md:max-w-xl relative">
                <form id="searchForm" class="relative w-full">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-base"></i>
                    </div>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search for movies, TV shows, genres..." 
                        autocomplete="off"
                        class="w-full pl-12 pr-24 py-3.5 bg-slate-900/80 border border-slate-800 rounded-xl focus:outline-none focus:border-sky-500 focus:ring-4 focus:ring-sky-500/10 text-white placeholder-slate-500 transition-all text-sm font-medium backdrop-blur-md shadow-inner"
                    >
                    <button type="submit" class="absolute right-2 top-2 bottom-2 px-5 bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold rounded-lg transition-all shadow-md shadow-sky-600/10">
                        Search
                    </button>
                </form>
                <!-- Autocomplete Dropdown Box -->
                <div id="previewDropdown" class="hidden absolute left-0 right-0 mt-2 bg-slate-900 border border-slate-800 rounded-xl shadow-2xl overflow-hidden z-50 max-h-80 overflow-y-auto ott-scroll backdrop-blur-xl"></div>
            </div>
            
            <!-- Spacer for visual balance on desktop desktop -->
            <div class="hidden md:block w-10"></div>
        </div>
    </header>

    <!-- Main Content Stage Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 relative z-10">
        
        <!-- STATUS INDICATOR -->
        <div id="statusState" class="hidden text-center py-20">
            <div id="statusSpinner" class="hidden mb-4">
                <div class="inline-block relative w-12 h-12">
                    <div class="absolute top-0 left-0 w-full h-full border-4 border-slate-900 rounded-full"></div>
                    <div class="absolute top-0 left-0 w-full h-full border-4 border-sky-500 rounded-full border-t-transparent animate-spin"></div>
                </div>
            </div>
            <p id="statusMessage" class="text-slate-400 font-medium max-w-sm mx-auto text-sm"></p>
        </div>

        <!-- VIEW 1: OTT PLATFORM HOME DASHBOARD -->
        <div id="homepageContainer" class="space-y-12">
            <!-- Dynamic Randomized Spotlight Hero Billboard -->
            <div id="heroBillboard" class="relative rounded-3xl overflow-hidden min-h-[460px] flex items-end p-6 sm:p-12 border border-slate-900 shadow-2xl bg-slate-950 transition-all duration-500">
                <div id="heroBg" class="absolute inset-0 bg-cover bg-center opacity-30 scale-102 transition-all duration-700"></div>
                <div class="absolute inset-0 bg-gradient-to-t from-[#030712] via-[#030712]/60 to-transparent"></div>
                
                <div class="relative z-10 max-w-2xl space-y-4">
                    <span class="text-xs font-bold uppercase tracking-widest text-sky-400 bg-sky-500/10 px-3 py-1 rounded-full border border-sky-500/20">Featured Selection</span>
                    <h1 id="heroTitle" class="text-3xl sm:text-5xl font-black text-white tracking-tight leading-tight">Loading Title...</h1>
                    <p id="heroPlot" class="text-slate-300 text-sm sm:text-base leading-relaxed font-light line-clamp-3">...</p>
                    <div class="pt-2 flex items-center gap-4">
                        <button id="heroBtn" class="px-6 py-3 bg-white hover:bg-slate-200 text-slate-950 font-bold rounded-xl transition-all shadow-lg flex items-center gap-2 text-sm">
                            <i class="fa-solid fa-circle-info"></i> Rating Insights
                        </button>
                    </div>
                </div>
            </div>

            <!-- Row 1: Randomized Movies -->
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold tracking-tight text-white flex items-center gap-2.5">Recommended Movies</h2>
                    <span class="text-xs text-slate-500 font-medium">Refreshed just now</span>
                </div>
                <div id="movieShelf" class="flex gap-6 overflow-x-auto pb-4 ott-scroll snap-x snap-mandatory">
                    <!-- Dynamic dynamic content insertion -->
                </div>
            </div>

            <!-- Row 2: Randomized TV Shows -->
            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-xl font-bold tracking-tight text-white flex items-center gap-2.5">Trending TV Series</h2>
                    <span class="text-xs text-slate-500 font-medium">Refreshed just now</span>
                </div>
                <div id="seriesShelf" class="flex gap-6 overflow-x-auto pb-4 ott-scroll snap-x snap-mandatory">
                    <!-- Dynamic dynamic content insertion -->
                </div>
            </div>
        </div>

        <!-- VIEW 2: SEARCH RESULT GRID -->
        <div id="resultsGridContainer" class="hidden">
            <div class="flex items-center justify-between border-b border-slate-900 pb-4 mb-6">
                <h2 class="text-lg font-bold text-white flex items-center gap-2.5">Search Results</h2>
                <button onclick="showHomepage()" class="text-xs font-medium text-sky-400 hover:underline">Return Home</button>
            </div>
            <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6"></div>
        </div>

        <!-- VIEW 3: DEDICATED RATINGS PROFILE -->
        <div id="detailViewContainer" class="hidden max-w-5xl mx-auto">
            <button onclick="backToPreviousView()" class="group mb-6 text-sm text-slate-400 hover:text-white font-semibold flex items-center gap-2 bg-slate-900/50 border border-slate-800/80 px-4 py-2 rounded-xl backdrop-blur-sm">
                <i class="fa-solid fa-arrow-left group-hover:-translate-x-0.5 transition-transform"></i> Back
            </button>
            <div id="detailContent" class="space-y-8"></div>
        </div>

    </main>

    <!-- Script Application Logic -->
    <script>
        const BASE_URL = 'https://www.omdbapi.com/'; 
        const API_KEY = 'thewdb'; 

        const searchInput = document.getElementById('searchInput');
        const previewDropdown = document.getElementById('previewDropdown');
        const searchForm = document.getElementById('searchForm');
        
        const homepageContainer = document.getElementById('homepageContainer');
        const resultsGridContainer = document.getElementById('resultsGridContainer');
        const resultsGrid = document.getElementById('resultsGrid');
        const detailViewContainer = document.getElementById('detailViewContainer');
        const detailContent = document.getElementById('detailContent');
        
        const statusState = document.getElementById('statusState');
        const statusSpinner = document.getElementById('statusSpinner');
        const statusMessage = document.getElementById('statusMessage');

        let debounceTimer;
        let activeView = 'home'; 

        // Deep Content Pool for Dynamic Home Catalog Randomization
        const spotlightPool = ['tt1375666', 'tt0816692', 'tt1130884', 'tt6751668', 'tt0111161', 'tt2488496', 'tt0468569', 'tt1375666'];
        
        const movieMasterPool = [
            'tt1375666', 'tt0816692', 'tt1130884', 'tt6751668', 'tt0111161', 
            'tt0468569', 'tt0109830', 'tt0133093', 'tt0068646', 'tt15097216',
            'tt1160419', 'tt2084970', 'tt3501632', 'tt0110912', 'tt0114709'
        ]; // Inception, Interstellar, Shutter Island, Parasite, Shawshank, Dark Knight, Forrest Gump, Matrix, Godfather, Dune 2, etc.
        
        const seriesMasterPool = [
            'tt0944947', 'tt1190634', 'tt2357228', 'tt9140554', 'tt8111088', 
            'tt0903747', 'tt4786824', 'tt6468322', 'tt4574334', 'tt12448384',
            'tt2560112', 'tt14366814', 'tt5103134', 'tt1798709', 'tt3032476'
        ]; // Game of Thrones, The Boys, Modern Family, Loki, Mandalorian, Breaking Bad, The Crown, Money Heist, Stranger Things, Shogun, etc.

        // Application Start
        window.addEventListener('DOMContentLoaded', () => {
            initializeDynamicHomepage();
        });

        function initializeDynamicHomepage() {
            // 1. Pick and render a random spotlight piece
            const randomSpotlightId = spotlightPool[Math.floor(Math.random() * spotlightPool.length)];
            loadHeroSpotlight(randomSpotlightId);

            // 2. Mix, slice and paint dynamic rows
            const randomMovies = shuffleArray([...movieMasterPool]).slice(0, 8);
            const randomSeries = shuffleArray([...seriesMasterPool]).slice(0, 8);

            loadShelfCollection(randomMovies, 'movieShelf');
            loadShelfCollection(randomSeries, 'seriesShelf');
        }

        // Standard Utility Shuffle Function
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Spotlight Random Content Loader
        async function loadHeroSpotlight(id) {
            try {
                const res = await fetch(`${BASE_URL}?apikey=${API_KEY}&i=${id}&plot=full`);
                const data = await res.json();
                if(data.Response === "True") {
                    document.getElementById('heroBg').style.backgroundImage = `url('${data.Poster}')`;
                    document.getElementById('heroTitle').innerText = data.Title;
                    document.getElementById('heroPlot').innerText = data.Plot !== 'N/A' ? data.Plot : 'No description recorded.';
                    document.getElementById('heroBtn').onclick = () => selectItem(data.imdbID);
                }
            } catch(e) { console.error("Spotlight rendering error", e); }
        }

        // Auto-Complete System
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            clearTimeout(debounceTimer);
            if (!query || query.length < 3) {
                previewDropdown.classList.add('hidden');
                return;
            }
            debounceTimer = setTimeout(() => fetchSuggestions(query), 250);
        });

        async function fetchSuggestions(query) {
            try {
                const res = await fetch(`${BASE_URL}?apikey=${API_KEY}&s=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data.Response === "True" && data.Search) {
                    renderPreviewDropdown(data.Search.slice(0, 5));
                } else {
                    previewDropdown.classList.add('hidden');
                }
            } catch (err) { console.error(err); }
        }

        function renderPreviewDropdown(items) {
            previewDropdown.innerHTML = items.map(item => {
                const poster = (item.Poster && item.Poster !== 'N/A') ? item.Poster : 'https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=120&auto=format&fit=crop';
                return `
                    <div class="flex items-center justify-between p-3.5 hover:bg-slate-800/60 cursor-pointer border-b border-slate-800/60 last:border-0 transition-colors" onclick="selectItem('${item.imdbID}')">
                        <div class="flex items-center space-x-4 truncate">
                            <img src="${poster}" class="w-9 h-12 object-cover rounded-lg bg-slate-950 flex-shrink-0 border border-slate-800">
                            <div class="truncate">
                                <p class="text-sm font-semibold text-slate-200 truncate">${item.Title}</p>
                                <p class="text-xs text-slate-500 font-medium mt-0.5">${item.Year} (${item.Type === 'series' ? 'TV' : 'Movie'})</p>
                            </div>
                        </div>
                        <i class="fa-solid fa-chevron-right text-xs text-slate-600 pr-2"></i>
                    </div>
                `;
            }).join('');
            previewDropdown.classList.remove('hidden');
        }

        // Global Search Submission Form
        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (!query) return;

            previewDropdown.classList.add('hidden');
            homepageContainer.classList.add('hidden');
            detailViewContainer.classList.add('hidden');
            showLoader('Searching Database Catalog...');

            try {
                const res = await fetch(`${BASE_URL}?apikey=${API_KEY}&s=${encodeURIComponent(query)}`);
                const data = await res.json();
                hideLoader();
                
                if (data.Response === "True" && data.Search) {
                    activeView = 'search';
                    resultsGridContainer.classList.remove('hidden');
                    renderGrid(data.Search, resultsGrid);
                } else {
                    showErrorMessage('No titles located matching that search term.');
                }
            } catch (err) {
                showErrorMessage('Network lookup error occurred.');
            }
        });

        function renderGrid(items, elementTarget) {
            elementTarget.innerHTML = items.map(item => {
                const poster = (item.Poster && item.Poster !== 'N/A') ? item.Poster : 'https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=400&auto=format&fit=crop';
                return `
                    <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl overflow-hidden shadow-lg hover:border-slate-700 group flex flex-col transition-all duration-300 cursor-pointer backdrop-blur-md" onclick="selectItem('${item.imdbID}')">
                        <div class="relative overflow-hidden aspect-[2/3] bg-slate-950">
                            <img src="${poster}" alt="${item.Title}" class="w-full h-full object-cover group-hover:scale-102 transition-transform duration-500">
                            <span class="absolute top-2.5 left-2.5 text-[10px] uppercase tracking-wider font-bold bg-slate-950/80 backdrop-blur-md text-sky-400 px-2 py-0.5 rounded border border-slate-800/40">${item.Type === 'series' ? 'TV' : 'Movie'}</span>
                        </div>
                        <div class="p-3.5 flex flex-col flex-grow justify-between gap-1">
                            <h3 class="font-semibold text-sm text-slate-200 group-hover:text-white line-clamp-2 transition-colors">${item.Title}</h3>
                            <span class="text-xs text-slate-500 font-medium">${item.Year}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Lazy-loading Dynamic Stream Rows
        async function loadShelfCollection(idArray, elementId) {
            const targetShelf = document.getElementById(elementId);
            targetShelf.innerHTML = '';
            
            for (let id of idArray) {
                try {
                    const res = await fetch(`${BASE_URL}?apikey=${API_KEY}&i=${id}`);
                    const item = await res.json();
                    if(item.Response === "True") {
                        const card = document.createElement('div');
                        card.className = 'w-44 sm:w-48 flex-shrink-0 snap-start group cursor-pointer bg-slate-900/30 border border-slate-800/60 rounded-2xl overflow-hidden p-2 hover:border-slate-700 transition-all duration-300';
                        card.onclick = () => selectItem(item.imdbID);
                        
                        const poster = (item.Poster && item.Poster !== 'N/A') ? item.Poster : 'https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=400&auto=format&fit=crop';
                        card.innerHTML = `
                            <div class="relative overflow-hidden aspect-[2/3] bg-slate-950 rounded-xl mb-3">
                                <img src="${poster}" class="w-full h-full object-cover group-hover:scale-103 transition-transform duration-500">
                                <div class="absolute bottom-2 right-2 text-[10px] bg-slate-950/80 backdrop-blur-md text-emerald-400 px-1.5 py-0.5 rounded font-bold border border-slate-800/40"><i class="fa-solid fa-star text-[9px] mr-1"></i>${item.imdbRating}</div>
                            </div>
                            <h3 class="font-semibold text-xs text-slate-200 line-clamp-1 group-hover:text-white transition-colors px-1">${item.Title}</h3>
                            <p class="text-[11px] text-slate-500 font-medium mt-0.5 px-1">${item.Year} • ${item.Type === 'series' ? 'TV' : 'Movie'}</p>
                        `;
                        targetShelf.appendChild(card);
                    }
                } catch(e) { console.error("Shelf dynamic item load failure", e); }
            }
        }

        // Detailed Content Display Node
        async function selectItem(imdbID) {
            previewDropdown.classList.add('hidden');
            homepageContainer.classList.add('hidden');
            resultsGridContainer.classList.add('hidden');
            showLoader('Loading Title Profile...');

            try {
                const res = await fetch(`${BASE_URL}?apikey=${API_KEY}&i=${imdbID}&plot=full`);
                const data = await res.json();
                hideLoader();
                if (data.Response === "True") {
                    activeView = 'details';
                    renderDetailCard(data);
                } else {
                    showErrorMessage('Failed to display item profile details.');
                }
            } catch (err) {
                showErrorMessage('Data extraction failure.');
            }
        }

        function renderDetailCard(data) {
            detailViewContainer.classList.remove('hidden');
            const poster = (data.Poster && data.Poster !== 'N/A') ? data.Poster : 'https://images.unsplash.com/photo-1594909122845-11baa439b7bf?q=80&w=500&auto=format&fit=crop';
            const isSeries = data.Type === 'series';

            let profileHeaderHtml = `
                <div class="flex flex-col md:flex-row gap-6 md:gap-8 items-center md:items-start bg-slate-900/20 border border-slate-800/50 rounded-3xl p-6 shadow-xl backdrop-blur-sm">
                    <img src="${poster}" class="w-44 rounded-xl border border-slate-800/80 shadow-2xl object-cover bg-slate-950 flex-shrink-0">
                    <div class="flex-grow space-y-3 text-center md:text-left">
                        <div class="flex items-center justify-center md:justify-start gap-2 text-xs font-semibold uppercase tracking-wider text-sky-400">
                            <span class="bg-sky-500/10 px-2 py-0.5 rounded border border-sky-500/20">${data.Type === 'series' ? 'TV Series' : 'Movie'}</span>
                            <span>•</span><span>${data.Year}</span><span>•</span><span>${data.Runtime}</span>
                        </div>
                        <h2 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">${data.Title}</h2>
                        <p class="text-xs text-slate-400 font-medium uppercase tracking-wider">${data.Genre}</p>
                        
                        <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-3 inline-flex items-center gap-4 shadow-inner text-left">
                            <div><span class="text-[10px] text-slate-500 font-bold uppercase block tracking-wider">IMDb Rating</span><span class="text-base font-extrabold text-emerald-400 flex items-center gap-1"><i class="fa-solid fa-star text-xs"></i>${data.imdbRating}<span class="text-xs text-slate-500 font-normal">/10</span></span></div>
                            <div class="border-l border-slate-800 h-6"></div>
                            <div><span class="text-[10px] text-slate-500 font-bold uppercase block tracking-wider">Total Votes</span><span class="text-sm font-semibold text-slate-300">${data.imdbVotes}</span></div>
                        </div>
                        <p class="text-sm text-slate-300 leading-relaxed font-light text-left pt-2"><span class="font-medium text-slate-400">Plot:</span> ${data.Plot !== 'N/A' ? data.Plot : 'No detailed plot documentation available.'}</p>
                    </div>
                </div>
            `;

            let episodicEngineHtml = '';
            if (isSeries && data.totalSeasons !== 'N/A') {
                let seasonOptions = '';
                for (let i = 1; i <= parseInt(data.totalSeasons); i++) {
                    seasonOptions += `<option value="${i}">Season ${i}</option>`;
                }

                episodicEngineHtml = `
                    <div class="mt-8 border-t border-slate-900 pt-6">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                            <div>
                                <h3 class="text-base font-bold text-white">Episode Guide</h3>
                                <p class="text-xs text-slate-500 mt-0.5">Select a season to browse individual episode images and ratings</p>
                            </div>
                            <div class="relative">
                                <select id="seasonSelector" class="w-full sm:w-auto bg-slate-900 border border-slate-800 text-xs font-semibold rounded-xl pl-3 pr-8 py-2 text-white focus:outline-none focus:border-sky-500 cursor-pointer appearance-none" onchange="loadEpisodes('${data.imdbID}', this.value)">
                                    ${seasonOptions}
                                </select>
                                <div class="absolute inset-y-0 right-0 flex items-center pr-2.5 pointer-events-none text-slate-500 text-[10px]"><i class="fa-solid fa-chevron-down"></i></div>
                            </div>
                        </div>
                        <div id="episodesLoading" class="hidden text-center text-xs text-slate-500 py-8"><div class="inline-block animate-spin w-4 h-4 border-2 border-sky-500 border-t-transparent rounded-full mr-2 align-middle"></div>Loading episodes...</div>
                        <div id="episodesGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                    </div>
                `;
            }

            detailContent.innerHTML = profileHeaderHtml + episodicEngineHtml;

            if (isSeries && data.totalSeasons !== 'N/A') {
                loadEpisodes(data.imdbID, 1);
            }
        }

        // Sub-request Engine for Individual Episode Thumbnails
        async function loadEpisodes(imdbID, seasonNum) {
            const grid = document.getElementById('episodesGrid');
            const loader = document.getElementById('episodesLoading');
            grid.innerHTML = '';
            loader.classList.remove('hidden');

            try {
                const res = await fetch(`${BASE_URL}?apikey=${API_KEY}&i=${imdbID}&Season=${seasonNum}`);
                const data = await res.json();
                
                if (data.Response === "True" && data.Episodes) {
                    grid.innerHTML = data.Episodes.map((ep, idx) => `
                        <div id="ep-card-${idx}" class="bg-slate-900/30 border border-slate-800/60 rounded-xl overflow-hidden p-3.5 flex gap-4 hover:border-slate-700 transition-colors shadow-md backdrop-blur-sm">
                            <div class="w-24 h-16 sm:w-28 sm:h-20 bg-slate-950 rounded-lg flex-shrink-0 overflow-hidden relative border border-slate-800/40">
                                <img id="ep-img-${idx}" src="" class="w-full h-full object-cover opacity-0 transition-opacity duration-300">
                                <div id="ep-fallback-${idx}" class="absolute inset-0 flex items-center justify-center bg-slate-900 text-slate-600 text-xs font-bold font-sans">EP ${ep.Episode}</div>
                            </div>
                            <div class="flex-grow flex flex-col justify-between min-w-0">
                                <div>
                                    <div class="flex items-center justify-between gap-2 text-[10px] font-bold text-slate-500 uppercase tracking-wider">
                                        <span>Episode ${ep.Episode}</span>
                                        <span class="font-normal normal-case">${ep.Released !== 'N/A' ? ep.Released : ''}</span>
                                    </div>
                                    <h4 class="font-bold text-sm text-slate-200 mt-0.5 truncate">${ep.Title}</h4>
                                </div>
                                <div class="flex justify-between items-center mt-2 text-[11px] font-medium text-slate-500">
                                    <span>IMDb Rating</span>
                                    <span class="font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-2 py-0.5 rounded-md"><i class="fa-solid fa-star text-[9px] mr-1"></i>${ep.imdbRating !== 'N/A' ? ep.imdbRating : 'N/A'}</span>
                                </div>
                            </div>
                        </div>
                    `).join('');
                    
                    loader.classList.add('hidden');

                    // Fire image lookup fetches concurrently
                    data.Episodes.forEach(async (ep, idx) => {
                        if (ep.imdbID) {
                            try {
                                const epDetailsRes = await fetch(`${BASE_URL}?apikey=${API_KEY}&i=${ep.imdbID}`);
                                const epDetails = await epDetailsRes.json();
                                const imgElement = document.getElementById(`ep-img-${idx}`);
                                const fallbackElement = document.getElementById(`ep-fallback-${idx}`);
                                
                                if (epDetails.Response === "True" && epDetails.Poster && epDetails.Poster !== 'N/A' && imgElement) {
                                    imgElement.src = epDetails.Poster;
                                    imgElement.onload = () => {
                                        imgElement.classList.remove('opacity-0');
                                        if (fallbackElement) fallbackElement.classList.add('hidden');
                                    }
                                }
                            } catch (e) { console.error("Episode thumbnail fetch error", e); }
                        }
                    });

                } else {
                    loader.classList.add('hidden');
                    grid.innerHTML = `<div class="col-span-full text-center text-xs text-slate-600 border border-dashed border-slate-800 py-8 rounded-xl bg-slate-900/10">No entries identified for this specific season.</div>`;
                }
            } catch (err) {
                loader.classList.add('hidden');
                grid.innerHTML = `<div class="col-span-full text-center text-xs text-red-400 py-8">Failed to index episodes.</div>`;
            }
        }

        // Navigation Controllers
        function showHomepage() {
            activeView = 'home';
            searchInput.value = '';
            previewDropdown.classList.add('hidden');
            detailViewContainer.classList.add('hidden');
            resultsGridContainer.classList.add('hidden');
            hideLoader();
            homepageContainer.classList.remove('hidden');
            
            // Re-shuffle everything when returning to the dashboard naturally
            initializeDynamicHomepage();
        }

        function backToPreviousView() {
            detailViewContainer.classList.add('hidden');
            if(activeView === 'search') {
                resultsGridContainer.classList.remove('hidden');
            } else {
                homepageContainer.classList.remove('hidden');
            }
        }

        function showLoader(msg) {
            statusState.classList.remove('hidden');
            statusSpinner.classList.remove('hidden');
            statusMessage.innerText = msg;
        }

        function hideLoader() {
            statusState.classList.add('hidden');
            statusSpinner.classList.add('hidden');
        }

        function showErrorMessage(msg) {
            statusState.classList.remove('hidden');
            statusSpinner.classList.add('hidden');
            statusMessage.innerText = msg;
        }

        // Click wrapper closing mechanics
        document.addEventListener('click', (e) => {
            if (!searchForm.contains(e.target) && !previewDropdown.contains(e.target)) {
                previewDropdown.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
