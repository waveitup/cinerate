<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineRate - Stream Ratings & Analytics</title>
    <!-- Tailwind CSS for Modern UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        /* Netflix-style horizontal row scrolling */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-gray-980 text-gray-100 min-h-screen font-sans bg-[#0b0f19]">

    <!-- Navbar -->
    <nav class="border-b border-gray-900 bg-[#0f172a]/60 backdrop-blur-lg sticky top-0 z-50 transition-colors duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-6">
                <!-- Premium Logo triggers Home Refresh -->
                <div onclick="showHomepage()" class="flex items-center space-x-2 text-2xl font-black tracking-tighter text-red-600 cursor-pointer select-none hover:opacity-90">
                    <i class="fa-solid fa-play-css text-xl text-red-500 animate-pulse"></i>
                    <span>CINE<span class="text-white">RATE</span></span>
                </div>
                <!-- Navigation Links -->
                <div class="flex items-center space-x-5 text-sm font-medium text-gray-400">
                    <span id="navHome" onclick="showHomepage()" class="text-white cursor-pointer hover:text-white transition-colors">Home</span>
                    <span id="navMovies" onclick="filterCategoryPage('movie')" class="cursor-pointer hover:text-white transition-colors">Movies</span>
                    <span id="navTV" onclick="filterCategoryPage('series')" class="cursor-pointer hover:text-white transition-colors">TV Shows</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Workspace Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-24">
        
        <!-- GLOBAL SEARCH BAR -->
        <div class="max-w-2xl mx-auto relative mb-12">
            <form id="searchForm" class="flex items-center relative">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-500">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search movies, TV shows, seasons..." 
                    autocomplete="off"
                    class="w-full pl-12 pr-24 py-3.5 bg-gray-900/80 border border-gray-800 rounded-xl focus:outline-none focus:border-red-500 focus:ring-2 focus:ring-red-500/10 text-white placeholder-gray-500 transition-all shadow-xl text-base"
                >
                <button 
                    type="submit" 
                    class="absolute right-2 top-2 bottom-2 px-5 bg-red-600 hover:bg-red-500 text-white font-medium rounded-lg transition-colors text-xs uppercase tracking-wider"
                >
                    Search
                </button>
            </form>

            <!-- LIVE PREVIEW SUGGESTION DROPDOWN -->
            <div 
                id="previewDropdown" 
                class="hidden absolute left-0 right-0 mt-2 bg-[#131a2c] border border-gray-800 rounded-xl shadow-2xl overflow-hidden z-50 max-h-72 overflow-y-auto custom-scrollbar"
            >
                <!-- Autocomplete items load here -->
            </div>
        </div>

        <!-- ==================== VIEW 1: HOME PLATFORM VIEW ==================== -->
        <div id="homepageContainer" class="space-y-12">
            <!-- Dynamic Spotlight Hero Banner -->
            <div id="spotlightHero" class="w-full h-48 md:h-72 rounded-3xl overflow-hidden relative shadow-2xl border border-gray-900 bg-gradient-to-r from-gray-900 to-slate-950 flex items-center p-8 bg-cover bg-center">
                <div class="absolute inset-0 bg-black/60 z-10"></div>
                <div id="heroDynamicContent" class="relative z-20 max-w-xl">
                    <!-- Loaded dynamically via random shuffle -->
                </div>
            </div>

            <!-- Dynamic Trending Movies Shelves -->
            <div>
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-bold tracking-tight text-white flex items-center gap-2"><i class="fa-solid fa-fire text-orange-500"></i> Trending Movies</h3>
                    <button onclick="initializeHomepageShelves()" class="text-xs text-gray-500 hover:text-red-400 transition-colors flex items-center gap-1"><i class="fa-solid fa-shuffle"></i> Shuffle Home</button>
                </div>
                <div id="trendingMoviesRow" class="flex gap-4 overflow-x-auto hide-scrollbar pb-2 scroll-smooth min-h-[250px]">
                    <!-- Shuffled cards load here -->
                </div>
            </div>

            <!-- Dynamic Popular TV Shows Shelves -->
            <div>
                <h3 class="text-xl font-bold mb-4 tracking-tight text-white flex items-center gap-2"><i class="fa-solid fa-tv text-purple-400"></i> Popular TV Shows</h3>
                <div id="popularTVRow" class="flex gap-4 overflow-x-auto hide-scrollbar pb-2 scroll-smooth min-h-[250px]">
                    <!-- Shuffled cards load here -->
                </div>
            </div>
        </div>

        <!-- ==================== VIEW 2: CATEGORY / SEARCH GRID VIEW ==================== -->
        <div id="resultsGridContainer" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 id="searchTitleText" class="text-xl font-bold text-white flex items-center gap-2">Catalog Browse</h2>
                <button onclick="showHomepage()" class="text-xs text-gray-400 hover:text-white transition-colors">Back to Home</button>
            </div>
            <div id="resultsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                <!-- Dynamic grid feeds -->
            </div>
        </div>

        <!-- ==================== VIEW 3: PROFILE DEEP DIVE VIEW ==================== -->
        <div id="detailViewContainer" class="hidden max-w-5xl mx-auto bg-[#111625]/60 border border-gray-900 rounded-3xl p-6 md:p-8 backdrop-blur-md shadow-2xl">
            <button id="detailBackButton" class="mb-6 text-xs text-red-400 hover:text-red-300 font-bold uppercase tracking-wider flex items-center gap-2 transition-colors">
                <i class="fa-solid fa-arrow-left"></i> Back to browse
            </button>
            <div id="detailContent">
                <!-- Detailed metadata profiles load here -->
            </div>
        </div>

    </main>

    <!-- JavaScript Application Engine -->
    <script>
        const BASE_URL = 'https://www.omdbapi.com/'; 
        const API_KEY = 'thewdb'; 

        // Target Elements Hooking
        const searchInput = document.getElementById('searchInput');
        const previewDropdown = document.getElementById('previewDropdown');
        const searchForm = document.getElementById('searchForm');
        const homepageContainer = document.getElementById('homepageContainer');
        const resultsGridContainer = document.getElementById('resultsGridContainer');
        const resultsGrid = document.getElementById('resultsGrid');
        const detailViewContainer = document.getElementById('detailViewContainer');
        const detailContent = document.getElementById('detailContent');
        const searchTitleText = document.getElementById('searchTitleText');
        const detailBackButton = document.getElementById('detailBackButton');

        let debounceTimer;
        let activeNavigationStack = 'home'; 

        // Deep Index Global Content Pools (IMDb IDs)
        const globalMoviePool = [
            'tt0111161', 'tt0468569', 'tt1375666', 'tt0137523', 'tt0109830', 'tt0068646', 'tt0110912', 'tt0816692',
            'tt0120737', 'tt0167260', 'tt1130884', 'tt2084970', 'tt0371724', 'tt0499549', 'tt0114746', 'tt0120338',
            'tt0993846', 'tt0463998', 'tt2488496', 'tt0087332', 'tt0097722', 'tt0103064', 'tt0112281', 'tt0241587',
            'tt0848228', 'tt0451279', 'tt0478970', 'tt1877832', 'tt0172495', 'tt2395417', 'tt0095016', 'tt0120815'
        ];

        const globalTVPool = [
            'tt0903747', 'tt0944947', 'tt4574334', 'tt3032476', 'tt0118301', 'tt0475759', 'tt2356777', 'tt6468322',
            'tt0411008', 'tt0290978', 'tt1430612', 'tt4707054', 'tt1190565', 'tt0904208', 'tt2560110', 'tt0108778',
            'tt2250750', 'tt0805663', 'tt5180504', 'tt1087896', 'tt3322312', 'tt0247082', 'tt2149151', 'tt0436992',
            'tt0904208', 'tt3107288', 'tt1475582', 'tt2442522', 'tt4230162', 'tt5771628', 'tt0120611', 'tt0986263'
        ];

        window.addEventListener('DOMContentLoaded', () => {
            initializeHomepageShelves();
        });

        // Fisher-Yates Complete Randomized Array Shuffle Engine
        function shuffleArray(array) {
            let m = array.length, t, i;
            while (m) {
                i = Math.floor(Math.random() * m--);
                t = array[m];
                array[m] = array[i];
                array[i] = t;
            }
            return array;
        }

        // 1. Setup Random Shuffle Home Layout Data Shelves
        async function initializeHomepageShelves() {
            const movieRow = document.getElementById('trendingMoviesRow');
            const tvRow = document.getElementById('popularTVRow');
            
            movieRow.innerHTML = `<div class="col-span-full py-8 text-center text-xs text-gray-500 w-full"><i class="fa-solid fa-circle-notch animate-spin text-red-500 mr-2"></i>Shuffling movies...</div>`;
            tvRow.innerHTML = `<div class="col-span-full py-8 text-center text-xs text-gray-500 w-full"><i class="fa-solid fa-circle-notch animate-spin text-purple-500 mr-2"></i>Shuffling series...</div>`;

            // Create separated tracking instances of scrambled ID lists
            const shuffledMovies = shuffleArray([...globalMoviePool]).slice(0, 8);
            const shuffledTV = shuffleArray([...globalTVPool]).slice(0, 8);

            // Fetch and mount spotlight layer configuration asynchronously from choice item
            setupDynamicHero(shuffledMovies[0]);

            // Load Movie Shuffled Shelf items
            movieRow.innerHTML = '';
            for (let id of shuffledMovies) {
                const data = await fetchProfileById(id);
                if (data) movieRow.insertAdjacentHTML('beforeend', buildHorizontalCard(data));
            }
            
            // Load TV Show Shuffled Shelf items
            tvRow.innerHTML = '';
            for (let id of shuffledTV) {
                const data = await fetchProfileById(id);
                if (data) tvRow.insertAdjacentHTML('beforeend', buildHorizontalCard(data));
            }
        }

        async function fetchProfileById(id) {
            try {
                const res = await fetch(`${BASE_URL}?apikey=${API_KEY}&i=${id}`);
                return await res.json();
            } catch { return null; }
        }

        async function setupDynamicHero(id) {
            const data = await fetchProfileById(id);
            if (!data) return;
            
            const heroBanner = document.getElementById('spotlightHero');
            const backdropPoster = (data.Poster && data.Poster !== 'N/A') ? data.Poster : '';
            heroBanner.style.backgroundImage = `url('${backdropPoster}')`;
            heroBanner.style.backgroundPosition = 'center 25%';

            document.getElementById('heroDynamicContent').innerHTML = `
                <span class="text-xs bg-red-600 text-white font-extrabold px-2.5 py-0.5 rounded uppercase tracking-widest mb-3 inline-block animate-pulse">Featured Today</span>
                <h2 class="text-3xl md:text-5xl font-black tracking-tight text-white mb-2 dropdown-shadow-md">${data.Title}</h2>
                <p class="text-xs md:text-sm text-gray-200 font-medium line-clamp-2 bg-black/50 backdrop-blur-sm p-2.5 rounded-xl border border-white/5 shadow">${data.Plot}</p>
                <button onclick="selectItem('${data.imdbID}')" class="mt-4 px-5 py-2 bg-white text-black text-xs font-bold rounded-lg uppercase tracking-wider hover:bg-gray-200 transition-colors shadow-lg">See Ratings</button>
            `;
        }

        function buildHorizontalCard(item) {
            const displayType = item.Type === 'series' ? 'TV SHOW' : 'MOVIE';
            const poster = (item.Poster && item.Poster !== 'N/A') ? item.Poster : 'https://via.placeholder.com/300x450?text=No+Poster';
            return `
                <div onclick="selectItem('${item.imdbID}')" class="w-40 sm:w-44 flex-shrink-0 cursor-pointer group bg-gray-900/30 rounded-xl overflow-hidden border border-gray-900 hover:border-gray-700 transition-all duration-300">
                    <div class="relative aspect-[2/3] overflow-hidden bg-gray-950">
                        <img src="${poster}" alt="${item.Title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" loading="lazy">
                        <span class="absolute bottom-2 left-2 text-[9px] font-black uppercase tracking-widest bg-black/80 px-2 py-0.5 rounded text-gray-300 border border-gray-800">${displayType}</span>
                    </div>
                    <div class="p-3">
                        <h4 class="text-xs font-bold text-white truncate group-hover:text-red-400 transition-colors">${item.Title}</h4>
                        <div class="flex items-center justify-between mt-1 text-[10px] text-gray-500 font-medium">
                            <span>${item.Year}</span>
                            <span class="text-emerald-400 font-bold"><i class="fa-solid fa-star text-[8px]"></i> ${item.imdbRating}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // 2. Category Browse Grid System
        async function filterCategoryPage(type) {
            homepageContainer.classList.add('hidden');
            detailViewContainer.classList.add('hidden');
            resultsGridContainer.classList.remove('hidden');
            
            updateNavbarHighlight(type);

            const displayTitle = type === 'series' ? 'Premium TV Shows Collection' : 'Premium Movies Collection';
            searchTitleText.innerText = displayTitle;
            resultsGrid.innerHTML = `<div class="col-span-full text-center py-12 text-sm text-gray-500"><i class="fa-solid fa-spinner animate-spin text-red-500 mr-2"></i>Loading category dashboard indexes...</div>`;
            activeNavigationStack = type;

            const trackingPool = type === 'series' ? [...globalTVPool] : [...globalMoviePool];
            shuffleArray(trackingPool);
            
            resultsGrid.innerHTML = '';
            for (let id of trackingPool.slice(0, 15)) {
                const data = await fetchProfileById(id);
                if (data) {
                    const poster = (data.Poster && data.Poster !== 'N/A') ? data.Poster : 'https://via.placeholder.com/300x450?text=No+Poster';
                    const displayTag = data.Type === 'series' ? 'TV SHOW' : 'MOVIE';
                    const gridCardHtml = `
                        <div class="bg-[#121824] border border-gray-900 rounded-2xl overflow-hidden shadow-lg hover:border-red-500/40 transition-all duration-300 flex flex-col group cursor-pointer" onclick="selectItem('${data.imdbID}')">
                            <div class="relative overflow-hidden aspect-[2/3] bg-gray-950">
                                <img src="${poster}" alt="${data.Title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                <span class="absolute top-2 left-2 text-[9px] uppercase tracking-widest font-black bg-black/80 text-red-400 px-2 py-0.5 rounded border border-gray-900">${displayTag}</span>
                            </div>
                            <div class="p-4 flex flex-col flex-grow justify-between">
                                <h3 class="font-bold text-sm text-white line-clamp-2 group-hover:text-red-400 transition-colors">${data.Title}</h3>
                                <div class="flex items-center justify-between mt-2 text-xs text-gray-500 font-medium">
                                    <span>${data.Year}</span>
                                    <span class="text-emerald-400 font-bold"><i class="fa-solid fa-star text-[9px]"></i> ${data.imdbRating}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    resultsGrid.insertAdjacentHTML('beforeend', gridCardHtml);
                }
            }
        }

        function updateNavbarHighlight(activeStack) {
            document.getElementById('navHome').className = activeStack === 'home' ? 'text-white font-medium cursor-pointer' : 'text-gray-400 cursor-pointer hover:text-white transition-colors';
            document.getElementById('navMovies').className = activeStack === 'movie' ? 'text-white font-medium cursor-pointer' : 'text-gray-400 cursor-pointer hover:text-white transition-colors';
            document.getElementById('navTV').className = activeStack === 'series' ? 'text-white font-medium cursor-pointer' : 'text-gray-400 cursor-pointer hover:text-white transition-colors';
        }

        // 3. Autocomplete Engine
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value.trim();
            clearTimeout(debounceTimer);
            if (!query || query.length < 3) {
                previewDropdown.classList.add('hidden');
                return;
            }
            debounceTimer = setTimeout(() => fetchSuggestions(query), 250);
        });

        async function fetchSuggestions(query) {
            try {
                const res = await fetch(`${BASE_URL}?apikey=${API_KEY}&s=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data.Response === "True" && data.Search) {
                    renderPreviewDropdown(data.Search.slice(0, 5));
                } else {
                    previewDropdown.classList.add('hidden');
                }
            } catch (err) { console.error(err); }
        }

        function renderPreviewDropdown(items) {
            previewDropdown.innerHTML = items.map(item => {
                const poster = (item.Poster && item.Poster !== 'N/A') ? item.Poster : 'https://via.placeholder.com/50x75?text=No+Img';
                const labelType = item.Type === 'series' ? 'TV SHOW' : item.Type.toUpperCase();
                return `
                    <div class="flex items-center justify-between p-2.5 hover:bg-gray-800/40 cursor-pointer border-b border-gray-900 last:border-0" onclick="selectItem('${item.imdbID}')">
                        <div class="flex items-center space-x-3 truncate">
                            <img src="${poster}" class="w-8 h-11 object-cover rounded bg-gray-900">
                            <div>
                                <span class="text-sm font-semibold text-gray-200 block truncate">${item.Title}</span>
                                <span class="text-[10px] text-gray-500 uppercase font-bold tracking-wider">${labelType} • ${item.Year}</span>
                            </div>
                        </div>
                        <i class="fa-solid fa-angle-right text-xs text-red-500 pr-2"></i>
                    </div>
                `;
            }).join('');
            previewDropdown.classList.remove('hidden');
        }

        // 4. Form Search Execution
        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = searchInput.value.trim();
            if (!query) return;
            
            previewDropdown.classList.add('hidden');
            homepageContainer.classList.add('hidden');
            detailViewContainer.classList.add('hidden');
            resultsGridContainer.classList.remove('hidden');
            searchTitleText.innerText = `Search Results for: "${query}"`;
            activeNavigationStack = 'search';
            updateNavbarHighlight('none');

            try {
                const res = await fetch(`${BASE_URL}?apikey=${API_KEY}&s=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (data.Response === "True" && data.Search) {
                    resultsGrid.innerHTML = data.Search.map(item => {
                        const poster = (item.Poster && item.Poster !== 'N/A') ? item.Poster : 'https://via.placeholder.com/300x450?text=No+Poster';
                        const typeLabel = item.Type === 'series' ? 'TV SHOW' : item.Type.toUpperCase();
                        return `
                            <div class="bg-[#121824] border border-gray-900 rounded-2xl overflow-hidden shadow-lg hover:border-red-500/40 transition-all duration-300 flex flex-col group cursor-pointer" onclick="selectItem('${item.imdbID}')">
                                <div class="relative overflow-hidden aspect-[2/3] bg-gray-950">
                                    <img src="${poster}" alt="${item.Title}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                                    <span class="absolute top-2 left-2 text-[9px] uppercase tracking-widest font-black bg-black/80 text-red-400 px-2 py-0.5 rounded border border-gray-900">${typeLabel}</span>
                                </div>
                                <div class="p-4 flex flex-col flex-grow justify-between">
                                    <h3 class="font-bold text-sm text-white line-clamp-2 group-hover:text-red-400 transition-colors">${item.Title}</h3>
                                    <span class="text-xs text-gray-500 mt-2 font-medium">${item.Year}</span>
                                </div>
                            </div>
                        `;
                    }).join('');
                } else {
                    resultsGrid.innerHTML = `<div class="col-span-full text-center py-12 text-sm text-gray-500">No content structures found matching your entry.</div>`;
                }
            } catch {
                resultsGrid.innerHTML = `<div class="col-span-full text-center py-12 text-sm text-red-500">Error transmitting search query requests.</div>`;
            }
        });

        // 5. Deep Profiles Management Layouts
        async function selectItem(imdbID) {
            previewDropdown.classList.add('hidden');
            homepageContainer.classList.add('hidden');
            resultsGridContainer.classList.add('hidden');
            detailViewContainer.classList.remove('hidden');

            detailContent.innerHTML = `<div class="text-center py-12 text-sm text-gray-500"><i class="fa-solid fa-circle-notch animate-spin text-red-500 mr-2 text-base"></i> Compiling profile layers...</div>`;

            try {
                const data = await fetchProfileById(imdbID);
                if (data && data.Response === "True") {
                    renderDetailCard(data);
                }
            } catch {
                detailContent.innerHTML = `<div class="text-center py-12 text-sm text-red-500">Failed to render profile metadata.</div>`;
            }
        }

        function renderDetailCard(data) {
            const poster = (data.Poster && data.Poster !== 'N/A') ? data.Poster : 'https://via.placeholder.com/300x450?text=No+Poster';
            const displayType = data.Type === 'series' ? 'TV SHOW' : data.Type.toUpperCase();
            const isTV = data.Type === 'series';

            if (activeNavigationStack === 'home') {
                detailBackButton.setAttribute('onclick', 'showHomepage()');
            } else {
                detailBackButton.setAttribute('onclick', 'backToGrid()');
            }

            let headerCardHtml = `
                <div class="flex flex-col gap-8 md:flex-row items-center md:items-start">
                    <img src="${poster}" class="w-48 sm:w-56 rounded-2xl border border-gray-900 shadow-2xl object-cover bg-gray-950 flex-shrink-0">
                    <div class="flex-grow text-center md:text-left">
                        <div class="flex items-center justify-center md:justify-start gap-2 text-xs font-bold uppercase tracking-wider text-red-400 mb-2">
                            <span class="bg-red-500/10 px-2.5 py-0.5 rounded border border-red-500/20">${displayType}</span>
                            <span>•</span><span>${data.Year}</span><span>•</span><span>${data.Runtime}</span>
                        </div>
                        <h2 class="text-3xl md:text-4xl font-black text-white mb-2 tracking-tight">${data.Title}</h2>
                        <p class="text-xs text-gray-500 font-bold uppercase tracking-widest mb-5">${data.Genre}</p>
                        
                        <div class="bg-black/30 border border-gray-900 rounded-xl p-3.5 inline-flex items-center gap-5 mb-5 text-left">
                            <div><span class="text-[10px] uppercase tracking-wider text-gray-500 font-bold block mb-0.5">IMDb Rating</span><span class="text-lg font-black text-emerald-400">${data.imdbRating}<span class="text-xs text-gray-600 font-normal">/10</span></span></div>
                            <div class="border-l border-gray-800 h-8"></div>
                            <div><span class="text-[10px] uppercase tracking-wider text-gray-500 font-bold block mb-0.5">Total Votes</span><span class="text-sm font-bold text-gray-300">${data.imdbVotes}</span></div>
                        </div>
                        <p class="text-sm text-gray-400 leading-relaxed max-w-3xl font-light">${data.Plot !== 'N/A' ? data.Plot : 'No description records logged.'}</p>
                        <div class="mt-4 pt-4 border-t border-gray-900 text-xs text-gray-500 space-y-1">
                            <div><span class="text-gray-400 font-semibold">Director:</span> ${data.Director}</div>
                            <div><span class="text-gray-400 font-semibold">Starring:</span> ${data.Actors}</div>
                        </div>
                    </div>
                </div>
            `;

            let episodesBoardHtml = '';
            if (isTV && data.totalSeasons !== 'N/A') {
                let seasonDropdownOptions = '';
                for (let i = 1; i <= parseInt(data.totalSeasons); i++) {
                    seasonDropdownOptions += `<option value="${i}">Season ${i}</option>`;
                }

                episodesBoardHtml = `
                    <div class="mt-12 pt-8 border-t border-gray-900">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                            <div>
                                <h3 class="text-lg font-black text-white flex items-center gap-2">
                                    <i class="fa-solid fa-rectangle-list text-red-500"></i> Season Episode Catalog
                                </h3>
                                <p class="text-xs text-gray-500 mt-0.5">Browse individual chronological episode profiles with custom posters</p>
                            </div>
                            <select id="seasonSelector" class="bg-gray-900 border border-gray-800 text-xs font-bold uppercase tracking-wider rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-red-500 cursor-pointer" onchange="loadSeasonEpisodes('${data.imdbID}', this.value)">
                                ${seasonDropdownOptions}
                            </select>
                        </div>
                        <div id="episodesLoader" class="hidden text-center text-sm text-gray-500 py-8"><i class="fa-solid fa-spinner animate-spin mr-2 text-red-500"></i>Streaming episode array grids...</div>
                        <div id="episodesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            <!-- Loaded dynamically via loop -->
                        </div>
                    </div>
                `;
            }

            detailContent.innerHTML = headerCardHtml + episodesBoardHtml;

            if (isTV && data.totalSeasons !== 'N/A') {
                loadSeasonEpisodes(data.imdbID, 1);
            }
        }

        async function loadSeasonEpisodes(imdbID, seasonNum) {
            const grid = document.getElementById('episodesGrid');
            const loader = document.getElementById('episodesLoader');
            grid.innerHTML = '';
            loader.classList.remove('hidden');

            try {
                const res = await fetch(`${BASE_URL}?apikey=${API_KEY}&i=${imdbID}&Season=${seasonNum}`);
                const data = await res.json();
                loader.classList.add('hidden');

                if (data.Response === "True" && data.Episodes) {
                    for (let ep of data.Episodes) {
                        const epDetails = await fetchEpisodeArtwork(ep.imdbID);
                        const epPoster = (epDetails && epDetails.Poster && epDetails.Poster !== 'N/A') ? epDetails.Poster : 'https://via.placeholder.com/320x180?text=Episode+Artwork';
                        const score = ep.imdbRating && ep.imdbRating !== 'N/A' ? ep.imdbRating : 'N/A';

                        const itemCard = `
                            <div class="bg-[#131926] border border-gray-900 rounded-xl overflow-hidden hover:border-gray-800 transition-all duration-300 flex flex-col justify-between group shadow-lg">
                                <div class="relative aspect-video w-full bg-gray-950 overflow-hidden border-b border-gray-900">
                                    <img src="${epPoster}" alt="${ep.Title}" class="w-full h-full object-cover group-hover:scale-102 transition-transform duration-300">
                                    <span class="absolute top-2 left-2 text-[9px] font-black tracking-wider uppercase bg-black/80 px-2 py-0.5 rounded text-gray-400">Ep ${ep.Episode}</span>
                                </div>
                                <div class="p-4 flex flex-col justify-between flex-grow">
                                    <div class="mb-3">
                                        <h4 class="font-bold text-sm text-white line-clamp-1 group-hover:text-red-400 transition-colors">${ep.Title}</h4>
                                        <span class="text-[10px] text-gray-500 font-medium">${ep.Released !== 'N/A' ? ep.Released : 'Release unknown'}</span>
                                    </div>
                                    <div class="flex items-center justify-between pt-2.5 border-t border-gray-950 text-xs">
                                        <span class="text-gray-500">Rating</span>
                                        <span class="font-black text-emerald-400 flex items-center gap-1 bg-emerald-500/5 border border-emerald-500/10 px-2 py-0.5 rounded-md"><i class="fa-solid fa-star text-[9px]"></i> ${score}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                        grid.insertAdjacentHTML('beforeend', itemCard);
                    }
                } else {
                    grid.innerHTML = `<div class="col-span-full text-center py-6 text-sm text-gray-600">No tracks found.</div>`;
                }
            } catch (err) {
                loader.classList.add('hidden');
                grid.innerHTML = `<div class="col-span-full text-center py-6 text-sm text-red-500">Failed to render segment tracks.</div>`;
            }
        }

        async function fetchEpisodeArtwork(epImdbID) {
            try {
                const res = await fetch(`${BASE_URL}?apikey=${API_KEY}&i=${epImdbID}`);
                return await res.json();
            } catch { return null; }
        }

        // Navigation Controllers
        function showHomepage() {
            detailViewContainer.classList.add('hidden');
            resultsGridContainer.classList.add('hidden');
            homepageContainer.classList.remove('hidden');
            searchInput.value = '';
            activeNavigationStack = 'home';
            updateNavbarHighlight('home');
            // Trigger automatic randomized shuffling on home visits
            initializeHomepageShelves();
        }

        function backToGrid() {
            detailViewContainer.classList.add('hidden');
            resultsGridContainer.classList.remove('hidden');
            updateNavbarHighlight(activeNavigationStack);
        }

        document.addEventListener('click', (e) => {
            if (!searchForm.contains(e.target) && !previewDropdown.contains(e.target)) {
                previewDropdown.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
